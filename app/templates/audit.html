<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audit · {{ grievance.ack_number }}</title><style>body{font-family:Inter,Arial,sans-serif;max-width:900px;margin:36px auto;padding:0 18px;color:#17212b;background:#f4f7f8}section{background:#fff;border:1px solid #dfe6eb;border-radius:12px;padding:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #e8edef}.muted{color:#66727d}</style></head><body><h1>Audit trail · {{ grievance.ack_number }}</h1><p class="muted">Sensitive grievance text is omitted from this view.</p><section><table><thead><tr><th>Time (UTC)</th><th>Action</th><th>Actor</th><th>Details</th></tr></thead><tbody>{% for e in entries %}<tr><td>{{ e.timestamp.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ e.action }}</td><td>{{ e.actor }}</td><td>{{ e.detail or '' }}</td></tr>{% else %}<tr><td colspan="4">No audit events.</td></tr>{% endfor %}</tbody></table></section><p><a href="{{ url_for('main.index') }}">Back to inbox</a></p></body></html>
