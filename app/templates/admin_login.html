<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin sign in · GrieveAI</title><style>body{font-family:Inter,Arial,sans-serif;max-width:480px;margin:12vh auto;padding:0 18px;color:#17212b;background:#f4f7f8}.box{background:white;border:1px solid #dfe6eb;border-radius:14px;padding:24px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #cad5db;border-radius:8px}button{margin-top:12px;background:#176b87;color:#fff;padding:10px 16px;border:0;border-radius:8px}.muted{color:#66727d}.error{color:#a43131;background:#fff1f1;padding:10px;border-radius:8px}</style></head><body><main class="box"><h1>Admin sign in</h1><p class="muted">GrieveAI demonstration inbox. Admin access requires the configured shared token.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}{% if configured %}<form method="post"><label for="token">Admin token</label><input id="token" name="token" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form>{% else %}<p>Admin actions are disabled. Configure <code>ADMIN_TOKEN</code> in the environment before use.</p>{% endif %}<p><a href="{{ url_for('main.submit_grievance') }}">Student submission</a></p></main></body></html>
